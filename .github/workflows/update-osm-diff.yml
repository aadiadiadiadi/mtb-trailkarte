name: OSM-Traildaten differentiell aktualisieren

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-Run: Nur Änderungen analysieren, nichts speichern"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: osm-trail-diff-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium requests

      - name: Aktuellen Schweizer OSM-Auszug laden
        run: |
          curl --fail --location --retry 5 --retry-delay 10 \
            --output switzerland-latest.osm.pbf \
            https://download.geofabrik.de/europe/switzerland-latest.osm.pbf

      - name: Differentiellen Abgleich ausführen
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="--dry-run"
          fi
          python scripts/update_trails_diff.py switzerland-latest.osm.pbf --dir . --chunks 10 $ARGS

      - name: Temporäre PBF-Datei aufräumen
        if: always()
        run: rm -f switzerland-latest.osm.pbf

      - name: Änderungen committen und pushen
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trails-*.geojson data-meta.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "OSM-Traildaten differentiell aktualisiert"
            git push
          fi