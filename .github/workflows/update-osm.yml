name: OSM-Traildaten aktualisieren

on:
  schedule:
    - cron: "30 20 * * 0"
      timezone: "Europe/Zurich"
  workflow_dispatch:
    inputs:
      max_dem:
        description: "Neue DEM-Berechnungen in diesem Lauf (0 = alle)"
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: osm-trail-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - name: Python-Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && pip install -r requirements-update.txt

      - name: Aktuellen Schweizer OSM-Auszug laden
        run: |
          curl --fail --location --retry 5 --retry-delay 10 \
            --output switzerland-latest.osm.pbf \
            https://download.geofabrik.de/europe/switzerland-latest.osm.pbf

      - name: Trail-Dateien erzeugen und Steigungen ergänzen
        env:
          MANUAL_MAX_DEM: ${{ github.event.inputs.max_dem }}
        run: |
          MAX_DEM="${MANUAL_MAX_DEM:-500}"
          python scripts/update_trails.py switzerland-latest.osm.pbf \
            --output-dir . --chunks 10 --workers 4 --max-dem "$MAX_DEM"

      - name: Änderungen veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trails-*.geojson data-meta.json elevation-cache.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "OSM-Traildaten automatisch aktualisiert"
            git push
          fi
