name: Höhen für Trails berechnen

on:
  workflow_dispatch:
    inputs:
      datei:
        description: "Welche Trail-Datei soll verarbeitet werden?"
        required: true
        default: "alle"
        type: choice
        options:
          - alle
          - "01"
          - "02"
          - "03"
          - "04"
          - "05"
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"

permissions:
  contents: write

concurrency:
  group: trail-hoehen
  cancel-in-progress: false

jobs:
  hoehen:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bibliotheken installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests shapely pyproj geopandas pyogrio

      - name: Höhen berechnen
        env:
          TRAIL_DATEI: ${{ inputs.datei }}
        run: |
          python scripts/berechne_hoehen.py --selection "$TRAIL_DATEI"

      - name: Änderungen prüfen
        id: changes
        run: |
          if git diff --quiet -- trails-*.geojson; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GeoJSON-Dateien sichern
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trails-mit-hoehen-${{ inputs.datei }}
          path: trails-*.geojson
          retention-days: 14

      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trails-*.geojson
          git commit -m "Höhenangaben für Trails ergänzen (${{ inputs.datei }})"
          git push
